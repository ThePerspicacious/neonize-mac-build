# Build a working neonize binary for Apple Silicon.
#
# WHY THIS EXISTS
# neonize ships a pre-compiled Go library (whatsmeow) inside its Python
# package. The published build is dated 21 Sep 2026, and WhatsApp now
# rejects clients built from it, which is why QR pairing hangs forever on
# "Getting a code from WhatsApp...". Upgrading the Python package does not
# help: every release up to 0.10.0 carries the same stale binary.
#
# The fix is to rebuild that component against newer upstream whatsmeow.
# That has to happen on a Mac, because the output is a macOS arm64 dylib and
# cross-compiling CGO for macOS needs Apple's own toolchain. GitHub's macOS
# runners are Apple Silicon and are free for public repositories, so the
# build happens there instead of on the client's machine.
#
# HOW TO USE IT
#   1. Make a new PUBLIC repository on GitHub (public keeps the macOS
#      minutes free; private bills them at a 10x rate).
#   2. Save this file as  .github/workflows/build-neonize-arm64.yml
#   3. Actions tab -> "Build neonize for Apple Silicon" -> Run workflow.
#   4. When it finishes, download the artifact from the run page.
#   5. Put the .dylib inside a folder called  patched/  next to app.py.
#      START_HERE_mac.command detects the chip and installs it by itself.
#
# WHY whatsmeow IS PINNED AND NOT @latest
# Upstream changes its interface every few months, and each change breaks
# the build until a patch below is written for it. @latest means the build
# can start failing on a day when nothing on our side changed. The pinned
# commit below is from 16 Nov 2026, is known to work with the patches here,
# and is far newer than the 21 Sep build that WhatsApp rejects, which is the
# only thing that actually matters. To move it forward later, bump the
# version and expect to add a patch.

name: Build neonize for Apple Silicon

on:
  workflow_dispatch:

# Needed by the last step, which commits the built file back into this
# repository so it can be fetched directly, without going through the
# Actions artifact zip.
permissions:
  contents: write

env:
  # The upstream commit this workflow's patches were written against.
  WHATSMEOW: v0.0.0-20261116172437-19d61352436f
  # The build WhatsApp rejects. The output must not contain this.
  BROKEN_STAMP: '20260921121126'

jobs:
  build:
    runs-on: macos-latest      # Apple Silicon. Do not pin a version number
                               # here: GitHub retires the numbered macOS
                               # labels, and a retired one is refused before
                               # any step runs, with the job showing as
                               # "cancelled" after about a second.
    steps:
      # Must come before the neonize clone, because this wipes the
      # workspace before it writes into it.
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Confirm this really is Apple Silicon
        run: |
          echo "arch:    $(uname -m)"
          sw_vers
          if [ "$(uname -m)" != "arm64" ]; then
            echo "This runner is not Apple Silicon, so the dylib it builds"
            echo "would not load on an M-series Mac. Stopping."
            exit 1
          fi

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Fetch the neonize source
        run: |
          git clone --depth 1 --branch 0.10.0 \
            https://github.com/krypton-byte/neonize src

      - name: Move to the pinned whatsmeow
        working-directory: src/goneonize
        env:
          GOFLAGS: -mod=mod
          GOTOOLCHAIN: auto
        run: |
          echo "before: $(grep -oE 'whatsmeow v[^ ]+' go.mod)"
          go get "go.mau.fi/whatsmeow@${WHATSMEOW}"
          go mod tidy
          echo "after:  $(grep -oE 'whatsmeow v[^ ]+' go.mod)"

      # Each patch below asserts that it actually applied. A patch that
      # silently matches nothing is worse than a failure, because the build
      # then fails later with a confusing error, or reports success after
      # changing nothing.
      - name: Apply the known API changes
        working-directory: src/goneonize
        run: |
          python3 - <<'PATCH'
          import re, pathlib, sys

          failures = []

          def need(n, label):
              if n:
                  print(f"  ok      {label}  ({n} site{'s' if n > 1 else ''})")
              else:
                  print(f"  MISSING {label}")
                  failures.append(label)

          # 1. types.Blocklist dropped its JIDs field. It now carries
          #    Items []BlocklistItem, where each item has LID, PN and Active.
          #    The old JIDs field held phone-number JIDs, so .PN is the
          #    faithful replacement.
          enc = pathlib.Path("utils/encoder.go")
          s = enc.read_text()
          pat = re.compile(
              r'for\s+_,\s*jid\s*:=\s*range\s+blocklist\.JIDs\s*\{\s*\n(\s*)'
              r'JIDs\s*=\s*append\(JIDs,\s*EncodeJidProto\(jid\)\)')
          s, n = pat.subn(
              lambda m: ('for _, item := range blocklist.Items {\n'
                         + m.group(1)
                         + 'JIDs = append(JIDs, EncodeJidProto(item.PN))'),
              s)
          enc.write_text(s)
          need(n, "encoder.go EncodeBlocklist -> Items/.PN")

          # 2 and 3. UpdateBlocklist and GetBlocklist both gained a trailing
          #          dhash argument.
          main = pathlib.Path("main.go")
          s = main.read_text()
          for old, new, label in [
              ('UpdateBlocklist(context.Background(), utils.DecodeJidProto(&JID), '
               'events.BlocklistChangeAction(C.GoString(action)))',
               'UpdateBlocklist(context.Background(), utils.DecodeJidProto(&JID), '
               'events.BlocklistChangeAction(C.GoString(action)), "")',
               "main.go UpdateBlocklist dhash arg"),
              ('GetBlocklist(context.Background())',
               'GetBlocklist(context.Background(), "")',
               "main.go GetBlocklist dhash arg"),
          ]:
              c = s.count(old)
              s = s.replace(old, new)
              need(c, label)
          main.write_text(s)

          if failures:
              print()
              print("One or more patches did not apply. Upstream has most")
              print("likely changed again. Send this log on rather than")
              print("shipping a binary built from a half-patched source.")
              sys.exit(1)
          print()
          print("all patches applied")
          PATCH

      - name: Build the dylib
        working-directory: src/goneonize
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build -buildmode=c-shared -ldflags=-s \
            -o neonize-darwin-arm64.dylib .
          ls -la neonize-darwin-arm64.dylib
          file neonize-darwin-arm64.dylib

      - name: Confirm it is a real arm64 dylib and not the stale build
        working-directory: src/goneonize
        run: |
          file neonize-darwin-arm64.dylib | grep -q 'arm64' || {
            echo "Output is not arm64. Stopping."; exit 1; }

          STAMP=$(strings -n 6 neonize-darwin-arm64.dylib \
                  | grep -oE 'whatsmeow@v[0-9.]+-[0-9]{14}' \
                  | grep -oE '[0-9]{14}' | sort -u | head -1)
          echo "whatsmeow build inside the dylib: ${STAMP:-unknown}"
          if [ "$STAMP" = "$BROKEN_STAMP" ]; then
            echo "This is still the build WhatsApp rejects. Do not ship it."
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: neonize-darwin-arm64
          path: src/goneonize/neonize-darwin-arm64.dylib
          if-no-files-found: error

      # Artifacts are only downloadable as a zip, from a storage host that
      # is not always reachable. Committing the file into the repo as well
      # means it can be fetched directly over plain HTTPS.
      # Only dist/ is staged, so the cloned neonize source in src/ is never
      # committed.
      - name: Publish the dylib into this repo
        run: |
          mkdir -p dist
          cp src/goneonize/neonize-darwin-arm64.dylib dist/
          ls -l dist/

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/neonize-darwin-arm64.dylib
          if git diff --cached --quiet; then
            echo "Identical file already committed, nothing to do."
          else
            git commit -m "Built dylib, whatsmeow ${WHATSMEOW}"
            git push
            echo "Pushed to dist/neonize-darwin-arm64.dylib"
          fi
